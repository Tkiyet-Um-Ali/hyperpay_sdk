name: hyperpay_sdk
description: "Flutter plugin for HyperPay (OPPWA) Mobile SDK v7.11.0. ReadyUI, CustomUI, Apple Pay, Google Pay, MADA, tokenization, and 3DS2."
version: 2.7.0
homepage: https://github.com/hrvojecukman/hyperpay_sdk
repository: https://github.com/hrvojecukman/hyperpay_sdk
issue_tracker: https://github.com/hrvojecukman/hyperpay_sdk/issues
topics:
  - payment
  - hyperpay
  - oppwa
  - mada

environment:
  sdk: ">=3.12.0 <4.0.0"
  # 3.38: UIScene plugin APIs (FlutterSceneLifeCycleDelegate / addSceneDelegate).
  # 3.44: built-in Kotlin (Android plugin no longer applies kotlin-android).
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.hyperpay.sdk
        pluginClass: HyperpaySdkPlugin
      ios:
        pluginClass: HyperpaySdkPlugin

  # TUA checkout screen (package:hyperpay_sdk/tua_checkout.dart).
  assets:
    - assets/tua/
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
